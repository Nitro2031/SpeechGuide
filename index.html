<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8">
    <title>読み上げ時間ガイド</title>
    <link rel="stylesheet" href="index.css">
  </head>

  <body>
    <h1>読み上げ時間ガイド</h1>

    <label>読み上げる文章</label><br>
    <textarea id="text"></textarea><br><br>

    <label>読み上げ速度（文字/分）</label><br>
    <input type="number" id="speed" value="400"><br><br>

    <label>持ち時間（分）</label><br>
    <input type="number" id="time" value="5"><br><br>

    <h2>結果</h2>
    <div id="summary"></div>
    <div id="result"></div>

    <script src="index.js"></script>
  </body>

</html>
