<!DOCTYPE html>
<html lang="ja">

  <head>
    <meta charset="UTF-8">
    <title>スピーチガイド</title>
    <link rel="stylesheet" href="index.css">
  </head>

  <body>
    <h1>スピーチガイド</h1>

    <label>読み上げる文章</label><span id="length"></span><br>
    <textarea id="text"></textarea><br><br>

    <div id="playerControls">
      <span>
        <label>　読上速度（文字/分）</label>
        <input type="number" id="speed" value="400" />
      </span>
      <span>
        <label>　持ち時間（分）</label>
        <input type="number" id="time" />
      </span>
      <span>
        <button id="play"> ▶ 再生 </button>
        <button id="stop"> ⏹ 停止 </button>
        <span id="currentTime">0:00</span>
      </span>
    </div>
    <div id="result"></div>

    <script src="index.js"></script>
  </body>

</html>
